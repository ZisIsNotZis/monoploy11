<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monopoly 11</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="setup">
  <h1>Monopoly 11</h1>
  <div class="setup-grid">
    <label>人数 <select id="count"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
    <label>地图 <select id="map"><option value="grid-manor">骑士庄园</option></select></label>
    <label>种子 <input id="seed" type="number" value="1"></label>
    <label>初始现金 <input id="startingCash" type="number" value="100000" step="10000"></label>
    <label>初始存款 <input id="startingDeposit" type="number" value="100000" step="10000"></label>
    <label>初始手牌 <input id="startingCards" type="number" value="3" min="0"></label>
    <label>手牌上限 <input id="handLimit" type="number" value="8" min="1"></label>
    <label>天数上限 <input id="dayLimit" type="number" value="100" min="1"></label>
    <label class="check"><input type="checkbox" id="testcards"> 测试卡组</label>
  </div>
  <div class="setup-head"><span>控制</span><span>角色</span><span>队伍</span></div>
  <div id="setupRows"></div>
  <div class="setup-row"><button id="start">开始</button></div>
  <p class="hint">队伍选同一个编号就是组队；每名参赛者可选人类或 AI。角色就是身份，没有额外名字。</p>
</div>

<main id="desk">
  <section id="board" aria-label="棋盘"></section>
  <aside id="side">
    <div id="sideGrip" title="拖动调整侧栏宽度"></div>
    <div id="system"></div>
    <div id="players"></div>
    <ol id="log"></ol>
    <div id="hand">
      <div id="cards"></div>
      <div id="dice"></div>
      <div id="choice" hidden></div>
    </div>
  </aside>
</main>

<script type="module" src="./src/main.js?v=96"></script>
</body>
</html>
